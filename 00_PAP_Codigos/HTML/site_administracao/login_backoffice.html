
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imoral - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="
    background-image: url('Images/imoral_background_teste_100x100_dark.jpeg');
    background-repeat: repeat; 
    width: 100%; 
    height: 400px;">

                <!-- card de formulario -->
                <div class="col-6 mx-auto ">
                    <div class="d-flex justify-content-center align-items-center min-vh-100">
                        <div class="card w-50" style="border: 2px solid black; min-height: 350px; min-width: 400px;">
                            <div class="card bg-black text-white" style="border: 1px solid white;">
                                <div class="card-body p-5">

                                    <!-- Title -->
                                    <div class="text-center mb-4">
                                        <img src="Images/imoral_logo1.png" alt="logo_imoral" class="mb-3" style="width: 300px;">
                                        <h2 class="card-title" style="font-size: 24px;">Login</h2>
                                    </div>
                                    <form id="contactForm" class="needs-validation" novalidate action="backoffice.html">
                                    
                                        <!-- Email -->
                                        <div class="mb-3">
                                            <label for="email" class="form-label" style="font-size: 20px;">Email</label>
                                            <input type="email" 
                                                   class="form-control bg-black text-white border-light" 
                                                   id="email" 
                                                   required>
                                            <div class="valid-feedback">
                                                Valid Email!
                                            </div>
                                            <div class="invalid-feedback">
                                                Please provide a valid email.
                                            </div>
                                        </div>

                                        <!-- Password -->
                                        <div class="mb-3">
                                            <label for="password" class="form-label" style="font-size: 20px;">Password</label>
                                            <input type="password" 
                                                   class="form-control bg-black text-white border-light" 
                                                   id="password" 
                                                   required>
                                            <div class="valid-feedback">
                                                Valid Password!
                                            </div>
                                            <div class="invalid-feedback">
                                                Please provide a password.
                                            </div>
                                        </div>
                                        
                                        <!-- Submit Button -->
                                        <button type="submit" class="btn btn-outline-light px-5 mt-5 mx-auto d-block">Login</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

    <!-- Sidebar fixa -->
        <div class="col-md-3 col-lg-2 d-md-block bg-black sidebar vh-100 p-3 position-fixed" style="width: 300px;">
            <!-- Logo -->
            <div class="mb-4 text-center">
                <img src="Images/imoral_logo1.png" alt="logo_imoral" class="mb-3" style="width: 200px;">
            </div>
            
            <!-- menu de navegação -->
            <div class="list-group d-flex flex-column gap-3" role="tablist">
                <ul class="list-unstyled">
                    <li>
                        <a class="list-group-item list-group-item-action border rounded px-4 mb-2 text-center active" style="width: 200px; background-color: black;"
                        data-bs-toggle="list"  href="#">
                            <svg class="me-2" width="16" height="16" style="fill: white;">
                                <use xlink:href="#home"></use>
                            </svg>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a  class="list-group-item list-group-item-action border rounded px-4 mb-2 text-center" style="width: 200px; background-color: black;"
                        data-bs-toggle="list" href="#">
                            <svg class="me-2" width="16" height="16" style="fill: white;">
                                <use xlink:href="#box"></use>
                            </svg>
                            Products
                        </a>
                    </li>
                    <li>
                        <a class="list-group-item list-group-item-action border rounded px-4 mb-2 text-center" style="width: 200px; background-color: black;"
                        data-bs-toggle="list" href="#">
                            <svg class="me-2" width="16" height="16" style="fill: white;">
                                <use xlink:href="#cart"></use>
                            </svg>
                            Orders
                        </a>
                    </li>
                    <li>
                        <a class="list-group-item list-group-item-action border rounded px-4 mb-2 text-center" style="width: 200px; background-color: black;"
                        data-bs-toggle="list" href="#">
                            <svg class="me-2" width="16" height="16" style="fill: white;">
                                <use xlink:href="#people"></use>
                            </svg>
                            Users
                        </a>
                    </li>
                        <a href="#" class="list-group-item list-group-item-action border rounded px-4 mb-2 text-center" style="width: 200px; background-color: black;"
                        data-bs-toggle="list" href="#">
                            <svg class="me-2" width="16" height="16" style="fill: white;">
                                <use xlink:href="#marketing"></use>
                            </svg>
                            Marketing
                        </a>
                    </li>
                </ul>      
            </div>
        </div>
        
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
